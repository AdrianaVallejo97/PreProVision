services:
  mysql:
    image: mysql:8.0
    container_name: preprovision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: preprovision
    ports:
      - "3306:3306"
    volumes:
      - preprovision_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: preprovision-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mongo:
    image: mongo:7
    container_name: preprovision-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - preprovision_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: preprovision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - preprovision_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  cache-service:
    build:
      context: ./Backend/cache-service
    container_name: preprovision-cache-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      INTERNAL_API_KEY: internal_shared_secret
    depends_on:
      - redis

volumes:
  preprovision_mysql_data:
  preprovision_mongo_data:
  preprovision_redis_data:
