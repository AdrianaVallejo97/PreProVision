services:
  mysql:
    image: mysql:8.0
    container_name: preprovision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: preprovision
    ports:
      - "3306:3306"
    volumes:
      - preprovision_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: preprovision-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mongo:
    image: mongo:7
    container_name: preprovision-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - preprovision_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: preprovision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - preprovision_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # ---------- SERVICES ----------
  user-service:
    build: ./Backend/user-service
    container_name: preprovision-user-service
    restart: unless-stopped
    env_file:
      - ./Backend/user-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - mysql

  auth-service:
    build: ./Backend/auth-service
    container_name: preprovision-auth-service
    restart: unless-stopped
    env_file:
      - ./Backend/auth-service/.env
    ports:
      - "3001:3001"
    depends_on:
      - user-service

  places-service:
    build: ./Backend/places-service
    container_name: preprovision-places-service
    restart: unless-stopped
    env_file:
      - ./Backend/places-service/.env
    ports:
      - "3003:3003"
    depends_on:
      - mongo

  agreements-service:
    build: ./Backend/agreements-service
    container_name: preprovision-agreements-service
    restart: unless-stopped
    env_file:
      - ./Backend/agreements-service/.env
    ports:
      - "3004:3004"
    depends_on:
      - mongo

  quotas-service:
    build: ./Backend/quotas-service
    container_name: preprovision-quotas-service
    restart: unless-stopped
    env_file:
      - ./Backend/quotas-service/.env
    ports:
      - "3005:3005"
    depends_on:
      - mongo

  documents-service:
    build: ./Backend/documents-service
    container_name: preprovision-documents-service
    restart: unless-stopped
    env_file:
      - ./Backend/documents-service/.env
    ports:
      - "3006:3006"
    depends_on:
      - mongo

  notifications-service:
    build: ./Backend/notifications-service
    container_name: preprovision-notifications-service
    restart: unless-stopped
    env_file:
      - ./Backend/notifications-service/.env
    ports:
      - "3007:3007"
    depends_on:
      - mongo

  cache-service:
    build: ./Backend/cache-service
    container_name: preprovision-cache-service
    restart: unless-stopped
    env_file:
      - ./Backend/cache-service/.env
    ports:
      - "3008:3008"
    depends_on:
      - redis

  viewing-service:
    build: ./Backend/viewing-service
    container_name: preprovision-viewing-service
    restart: unless-stopped
    env_file:
      - ./Backend/viewing-service/.env
    ports:
      - "3009:3009"
    depends_on:
      - mongo

  monitoring-service:
    build: ./Backend/monitoring-service
    container_name: preprovision-monitoring-service
    restart: unless-stopped
    env_file:
      - ./Backend/monitoring-service/.env
    ports:
      - "3010:3010"

  api-gateway:
    build: ./Backend/api-Gateway
    container_name: preprovision-api-gateway
    restart: unless-stopped
    env_file:
      - ./Backend/api-Gateway/.env
    ports:
      - "3100:3100"
    depends_on:
      - auth-service
      - user-service
      - places-service
      - agreements-service
      - quotas-service
      - documents-service
      - notifications-service
      - cache-service
      - viewing-service
      - monitoring-service

volumes:
  preprovision_mysql_data:
  preprovision_mongo_data:
  preprovision_redis_data:
