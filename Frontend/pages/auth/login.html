<section class="auth-shell">
  <div class="auth-panel">
    <div class="card auth-card">
      <div class="brand">
        <div class="brand-logo">
          <img src="/assets/img/logo.png" alt="Logo" onerror="this.style.display='none'" />
        </div>
        <div>
          <div class="brand-name">PreProvision</div>
          <div class="brand-sub">Sign in</div>
        </div>
      </div>

      <form id="loginForm" class="form-grid" style="margin-top:14px;">
        <div>
          <div class="label">Email</div>
          <input id="email" class="input" type="email" placeholder="student@uce.edu.ec" required />
        </div>

        <div>
          <div class="label">Password</div>
          <input id="password" class="input" type="password" placeholder="••••••••" required minlength="6" />
        </div>

        <button id="btnLogin" class="btn btn-primary" type="submit">Login</button>
      </form>
    </div>
  </div>
</section>
