<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard | PreProVision</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <img class="toplogo" src="/assets/images/logo.png" alt="logo" />
      <span>PreProVision</span>
    </div>
    <button id="logout" class="btn">Log out</button>
  </header>

  <main class="wrap">
    <h1>Student Panel</h1>
    <p class="muted">Browse available places and track your agreement status.</p>

    <section class="grid">
      <a class="tile" href="#">Browse places (next)</a>
      <a class="tile" href="#">My agreements (next)</a>
      <a class="tile" href="#">My documents (next)</a>
      <a class="tile" href="#">Support (next)</a>
    </section>
  </main>

  <script type="module" src="/js/pages/student-dashboard.js"></script>
</body>
</html>
