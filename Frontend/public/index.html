<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PreProVision | Login</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth">
    <section class="card">
      <aside class="brand">
        <img class="logo" src="/assets/images/logo.png" alt="PreProVision logo" />
        <h1>PreProVision</h1>
        <p>Pre-professional internship<br/>management</p>
      </aside>

      <section class="panel">
        <h2>Sign in</h2>

        <div id="msg" class="msg" aria-live="polite"></div>

        <form id="loginForm">
          <label>Institutional email</label>
          <input id="email" type="email" placeholder="admin@preprovision.local" required />

          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" required />

          <button id="btnLogin" type="submit">Sign in</button>
        </form>

        <p class="hint">
          Forgot your password? <b>Option A:</b> Contact the administrator.
        </p>
      </section>
    </section>
  </main>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
